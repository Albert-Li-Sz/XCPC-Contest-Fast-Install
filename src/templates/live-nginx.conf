map $http_upgrade $icpc_live_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    server_name @@HOST@@;
    ssl_certificate /etc/icpc-cds/tls/cds.crt;
    ssl_certificate_key /etc/icpc-cds/tls/cds.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256m;
    access_log /var/log/nginx/icpc-live.access.log;
    error_log /var/log/nginx/icpc-live.error.log;

    location /cds/ {
        limit_except GET { deny all; }
        proxy_pass https://127.0.0.1:8443/api/;
        proxy_set_header Host 127.0.0.1:8443;
        proxy_set_header Authorization "";
        proxy_ssl_trusted_certificate /etc/icpc-cds/tls/cds.crt;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $icpc_live_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
